name: Flutter checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/app lib/main.dart test
      - run: flutter analyze
      - run: flutter test
