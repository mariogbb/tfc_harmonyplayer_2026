name: Flutter checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib/app lib/control lib/data/dao.dart lib/data/repositories lib/data/services lib/ui lib/main.dart test integration_test
      - run: flutter analyze
      - run: flutter test

  linux-package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good libsqlite3-dev dpkg-dev ffmpeg xvfb xauth
      - run: flutter pub get
      - run: xvfb-run -a flutter test integration_test/desktop_smoke_test.dart -d linux
      - run: linux/packaging/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: harmony-player-ubuntu-22.04-amd64
          path: build/harmony-player_*_amd64.deb
          if-no-files-found: error

  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build windows --debug
