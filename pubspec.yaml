name: player
description: Harmony Player is an UI/UX design centered app for playing music.

publish_to: "none"
version: 1.1.0

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  cupertino_icons: ^1.0.2
  path: ^1.8.1
  on_audio_query: ^2.6.1
  cached_network_image: ^3.2.1
  html: ^0.15.0
  http: ^1.6.0
  audio_service: ^0.18.7
  sqflite: ^2.0.3+1
  audioplayers: ^6.8.1
  provider: ^6.0.3
  vertical_tabs_flutter: ^1.0.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.0.15
  carousel_slider: ^5.1.2
  flutter_settings_screens: ^0.3.3-null-safety+2
  package_info_plus: ^4.0.0
  visibility_detector: ^0.4.0+2
  cast: ^2.1.0
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_crashlytics: ^5.0.0
  firebase_performance: ^0.11.0
  flutter_launcher_icons: ^0.13.1
  url_launcher: ^6.1.10
  firebase_remote_config: ^6.0.0
  firebase_analytics: ^12.0.0
  filesystem_picker: ^4.1.0
  fuzzysearch: ^0.1.3
  sqflite_common_ffi: ^2.4.5
  # cast 2.1 uses the Bonsoir 5 discovery API; 6+ is incompatible.
  bonsoir: ^5.1.11
  device_info_plus: ^12.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter_icons:
  image_path: "assets/app_icon.png"
  android: "launcher_icon"

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - fonts/
    - assets/wellcome_screen/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-SemiBold.ttf
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Bold.ttf
    - family: Roboto
      fonts:
        - asset: fonts/Inter.ttf
        - asset: fonts/Roboto-Regular.ttf
