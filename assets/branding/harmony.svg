    <rect x="142" y="117" width="19" height="78" rx="9.5"/>
    <rect x="168" y="103" width="19" height="43" rx="9.5"/>
    <rect x="168" y="152" width="19" height="31" rx="9.5"/>
    <rect x="194" y="120" width="19" height="43" rx="9.5"/>
    <rect x="220" y="133" width="19" height="19" rx="9.5"/>
