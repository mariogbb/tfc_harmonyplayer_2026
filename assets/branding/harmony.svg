      <stop stop-color="#303946"/>
      <stop offset="1" stop-color="#181e26"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b6cdff"/>
      <stop offset="1" stop-color="#85b6ed"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="60" fill="#242b35"/>
  <rect x="8" y="8" width="284" height="284" rx="54" fill="url(#surface)"/>
  <g fill="#111923" opacity="0.5" transform="translate(2 4)">
